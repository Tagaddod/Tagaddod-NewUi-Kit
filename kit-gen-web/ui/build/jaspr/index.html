<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tagaddod Kit Gen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Core hljs MUST load before languages/dart.min.js (which only registers Dart). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dart.min.js"></script>
</head>
<body>
  <script src="main.client.dart.js" defer></script>
  <script>
    function highlightCode() {
      if (typeof hljs === 'undefined') return;
      document.querySelectorAll('pre code').forEach(function (el) {
        if (!el.dataset.highlighted) hljs.highlightElement(el);
      });
    }
    setInterval(highlightCode, 500);
  </script>
</body>
</html>
